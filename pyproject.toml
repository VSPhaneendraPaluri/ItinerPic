[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "itinerpic-web"
version = "1.0.0"
description = "ItinerPic travel planning website built in Python"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "ItinerPic Team" }]
keywords = ["travel", "itinerary", "website", "flask", "python"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "Flask==3.0.3",
    "Flask-SQLAlchemy==3.1.1",
    "Jinja2==3.1.2",
    "python-dotenv==1.0.0",
    "click==8.1.7",
    "gunicorn==23.0.0",
    "psycopg==3.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "pytest-cov==5.0.0",
    "black==24.8.0",
    "flake8==7.1.1",
    "mypy==1.11.2",
]

[project.scripts]
run-itinerpic = "tools.run_server:main"

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
